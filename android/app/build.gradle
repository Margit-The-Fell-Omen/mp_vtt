plugins {
    id 'com.android.application'
}

android {
    namespace 'org.adventureboard'
    compileSdk 36
    buildToolsVersion '36.1.0'

    defaultConfig {
        applicationId 'org.adventureboard'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        ndkVersion '29.0.14206865'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
