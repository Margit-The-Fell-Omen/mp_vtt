name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create, e.g. v0.1.0"
        required: true
        type: string

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            pkg-config \
            libx11-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libxkbcommon-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Package
        run: |
          mkdir -p dist
          cp build/AdventureBoard dist/
          cp assets/fonts/LICENSE-Liberation.txt dist/
          tar -C dist -czf AdventureBoard-linux-x86_64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: AdventureBoard-linux-x86_64.tar.gz

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/AdventureBoard.exe dist/
          Copy-Item assets/fonts/LICENSE-Liberation.txt dist/
          Compress-Archive -Path dist/* -DestinationPath AdventureBoard-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: AdventureBoard-windows-x86_64.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager | head -n1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Accept SDK licenses
        run: yes | "$SDKMANAGER" --licenses > /dev/null || true
      - name: Install SDK components
        run: |
          yes | "$SDKMANAGER" "platforms;android-36" \
                              "build-tools;36.1.0" \
                              "platform-tools" \
                              "ndk;29.0.14206865"
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure local SDK paths
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "cmake.dir=/usr" >> android/local.properties
      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Package APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AdventureBoard-android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: AdventureBoard-android-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Show release assets
        run: find dist -type f -printf '%p\n'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            dist/linux-binary/AdventureBoard-linux-x86_64.tar.gz
            dist/windows-binary/AdventureBoard-windows-x86_64.zip
            dist/android-apk/AdventureBoard-android-debug.apk
          generate_release_notes: true
